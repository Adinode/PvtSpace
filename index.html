<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOTO</title>
    <link rel="manifest" href="manifest.json">
    <style>
    :root {
        --bg-dark: #000000;
        --bg-gradient: linear-gradient(180deg, #0f0f0f 0%, #000000 100%);
        --glass-bg: rgba(30, 30, 30, 0.9);
        --glass-border: rgba(255, 255, 255, 0.15);
        --accent: #0affff;
        --text: #ffffff;
        --msg-bg: #1f2c34;
        --selected-bg: rgba(10, 255, 255, 0.15);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; user-select: none; }

    body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-gradient); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    .hidden { display: none !important; }
    .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }

    .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); color: var(--accent); padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: black; border: none; }

    /* Dashboard */
    #dashboard { flex: 1; padding: 20px; padding-bottom: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .thread-item {
        background: rgba(20, 20, 20, 0.8); border: 1px solid var(--glass-border); border-radius: 20px;
        display: flex; align-items: center; flex-shrink: 0; min-height: 80px; position: relative;
    }
    .thread-clickable { flex: 1; padding: 25px; height: 100%; display: flex; align-items: center; justify-content: space-between; }
    .thread-title { font-size: 1.2rem; font-weight: 600; color: white; }
    .thread-menu-btn { background: transparent; border: none; border-left: 1px solid rgba(255,255,255,0.1); width: 50px; height: 100%; color: #888; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; cursor: pointer; }

    .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; font-size: 30px; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.6); z-index: 90; background: var(--accent); color: black; border: none; }

    /* Chat */
    #chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; display: flex; flex-direction: column; z-index: 50; }
    header { padding: 15px; display: flex; align-items: center; gap: 15px; z-index: 10; justify-content: space-between; height: 60px; }
    
    #selection-header {
        position: absolute; top: 0; left: 0; width: 100%; height: 60px; background: #1a1a1a; z-index: 11; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--accent);
        transform: translateY(-100%); transition: transform 0.2s;
    }
    #selection-header.active { transform: translateY(0); }

    #chat-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }

    .message-wrapper { position: relative; width: 100%; display: flex; flex-direction: column; align-items: flex-end; transition: all 0.2s; flex-shrink: 0; }
    .message { max-width: 85%; background: var(--msg-bg); color: white; padding: 8px 12px; border-radius: 12px; font-size: 1rem; line-height: 1.4; position: relative; }
    
    .message-wrapper.selected .message { background: var(--selected-bg); border: 1px solid var(--accent); }
    .message-wrapper.selected::before { content: '✔'; position: absolute; left: -30px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 1.2rem; font-weight: bold; }

    /* Media */
    .image-grid { display: grid; gap: 2px; border-radius: 12px; overflow: hidden; width: 260px; }
    .image-grid img { width: 100%; height: 100%; object-fit: cover; aspect-ratio: 1/1; display: block; cursor: pointer; }
    .grid-1 { grid-template-columns: 1fr; } .grid-2 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .grid-3 img:nth-child(3) { grid-column: span 2; } .grid-4 { grid-template-columns: 1fr 1fr; }
    
    .single-img { width: 160px; height: 160px; object-fit: cover; border-radius: 12px; display: block; cursor: pointer; }
    
    /* Video Styling */
    .video-container { width: 100%; max-width: 280px; border-radius: 12px; overflow: hidden; background: black; }
    video { width: 100%; display: block; }

    .message-time { position: absolute; right: -60px; top: 50%; transform: translateY(-50%); font-size: 0.75rem; color: #888; opacity: 0; transition: opacity 0.2s; }
    .swiping-left .message-time { opacity: 1; }

    #input-area { padding: 10px; display: flex; gap: 10px; align-items: flex-end; padding-bottom: calc(10px + safe-area-inset-bottom); }
    #msg-input { flex: 1; background: #2a2a2a; border: none; color: white; padding: 12px; border-radius: 20px; font-size: 1rem; max-height: 100px; overflow-y: auto; }
    .icon-btn { background: none; border: none; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .icon-btn svg { width: 24px; height: 24px; fill: var(--accent); }

    #modal, #lightbox, #thread-options-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; justify-content: center; align-items: center; }
    .modal-box { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #333; }
    
    #lightbox img { max-width: 100%; max-height: 90vh; object-fit: contain; }
    #lightbox-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 2rem; cursor: pointer; z-index: 201; }

    #menu-dropdown { position: fixed; top: 60px; right: 10px; background: #2a2a2a; padding: 10px; border-radius: 10px; display: none; width: 150px; z-index: 100; }
    #reply-preview { background: #1f1f1f; border-left: 4px solid var(--accent); padding: 10px; font-size: 0.85rem; color: #aaa; display: flex; justify-content: space-between; }

    /* --- FIXED PRINT / PDF EXPORT CSS --- */
    @media print {
        /* 1. Unlock Layout */
        html, body { 
            height: auto !important; 
            overflow: visible !important; 
            background: white !important; 
            color: black !important; 
        }

        /* 2. Hide UI Elements */
        #dashboard, #add-btn, #input-area, header, #selection-header, #menu-dropdown, .fab, #reply-preview, #modal, #lightbox, #login-screen {
            display: none !important;
        }

        /* 3. Prepare Chat Screen */
        #chat-screen {
            position: relative !important;
            height: auto !important;
            width: 100% !important;
            overflow: visible !important;
            display: block !important;
            background: white !important;
            z-index: auto !important;
        }

        /* 4. Prepare Message Area */
        #chat-area {
            height: auto !important;
            overflow: visible !important;
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        /* 5. Style Messages for Paper */
        .message-wrapper {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 10px;
            display: block !important; /* Helps prevent cutting off */
            text-align: right;
        }

        .message {
            background: #f0f0f0 !important;
            color: black !important;
            border: 1px solid #ccc !important;
            box-shadow: none !important;
            display: inline-block;
        }

        .message-time {
            position: static !important;
            opacity: 1 !important;
            color: #555 !important;
            font-size: 0.7rem;
            margin-top: 2px;
            display: block;
        }

        /* Ensure images fit on paper */
        img { max-width: 100% !important; }
    }

       /* START: SECRET ENTRY CSS */
    #secret-entry {
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
        background: #000000; z-index: 999999; 
        display: flex; justify-content: center; align-items: center;
        transition: opacity 0.5s ease, visibility 0.5s;
        touch-action: manipulation;
    }
    #secret-entry img {
        width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    }
    #secret-entry.unlocked {
        opacity: 0; visibility: hidden; pointer-events: none;
    }
    /* END: SECRET ENTRY CSS */
</style>
</head>
<body>
    <div id="secret-entry">
        <img src="bg.png" alt="Loading...">
    </div>

    <div id="lightbox" class="hidden"><div id="lightbox-close" onclick="closeLightbox()">✕</div><img id="lightbox-img" src=""></div>

    <div id="thread-options-modal" class="hidden">
        <div class="modal-box">
            <h3 style="color:white; margin-top:0;">Manage Space</h3>
            <p style="color:#aaa;">Permanently delete this space and all notes inside it?</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn" style="border-color:#ff4b4b; color:#ff4b4b;" onclick="confirmDeleteThread()">Delete Forever</button>
                <button class="btn" onclick="closeThreadOptions()">Cancel</button>
            </div>
        </div>
    </div>

    <div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:999; background:black; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <h2 style="color:white; margin-bottom:20px;">Identity</h2>
        <input type="text" id="username-input" style="background:#222; border:1px solid #444; padding:15px; color:white; border-radius:10px; text-align:center; font-size:1.2rem; outline:none;" placeholder="Enter Name">
        <button class="btn btn-primary" onclick="attemptLogin()" style="margin-top:20px; width:150px;">ENTER</button>
    </div>

    <div id="dashboard" class="hidden">
        <h1 style="margin: 40px 20px 20px; font-weight:800; font-size:2rem;">MOTO</h1>
        <div id="storage-display" style="margin: 0 20px 20px; color: #888; font-size: 0.9rem;">Checking storage...</div>
        <div id="thread-list"></div>
    </div>
    <button id="add-btn" class="fab hidden" onclick="showNewThreadModal()">+</button>

    <div id="chat-screen" class="hidden">
        <header class="glass" id="std-header">
            <div style="display:flex; align-items:center; gap:15px;">
                <button class="icon-btn" onclick="closeChat()"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
                <h3 id="current-chat-title" style="margin:0; font-size:1.1rem;">Notes</h3>
            </div>
            <button class="icon-btn" onclick="toggleMenu()"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>
        </header>

        <div id="selection-header">
            <div style="display:flex; align-items:center; gap:15px; color:white;">
                <button class="icon-btn" onclick="exitSelectionMode()">✕</button>
                <span id="selected-count" style="font-size:1.1rem; font-weight:bold;">0 Selected</span>
            </div>
            <button class="icon-btn" onclick="deleteSelected()"><svg viewBox="0 0 24 24" style="fill:#ff4b4b;"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
        </div>

        <div id="menu-dropdown"><div onclick="exportPDF()" style="padding:10px; color:white;">Export to PDF</div></div>
        <div id="chat-area"></div>
        <div id="reply-preview" class="hidden"><span id="reply-text">Replying...</span><button onclick="cancelReply()" style="background:none; border:none; color:white;">✕</button></div>

        <div id="input-area" class="glass">
            <button class="icon-btn" onclick="triggerFile()"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
            <input type="text" id="msg-input" placeholder="Message" autocomplete="off">
            <button class="icon-btn" id="mic-btn" onclick="toggleRecord()"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            <button class="icon-btn" onclick="sendText()" id="send-btn" style="display:none;"><svg viewBox="0 0 24 24" style="fill:#0affff;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*,video/*" multiple hidden onchange="handleFile(this)">

    <div id="modal" class="hidden">
        <div class="modal-box">
            <h3 style="margin-top:0; color:white;">New Space</h3>
            <input type="text" id="new-thread-name" placeholder="Name" style="width:100%; padding:10px; background:#333; border:none; color:white; border-radius:8px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="createThread(true)">Skip</button>
                <button class="btn btn-primary" onclick="createThread(false)">Create</button>
            </div>
        </div>
    </div>

    <script>
        // SECRET ENTRY LOGIC
    document.addEventListener("DOMContentLoaded", () => {
        const secretOverlay = document.getElementById('secret-entry');
        let secretTaps = 0;
        let lastSecretTap = 0;

        secretOverlay.addEventListener('click', (e) => {
            e.preventDefault(); 
            const now = new Date().getTime();
            const timeDiff = now - lastSecretTap;

            if (timeDiff < 500 && timeDiff > 0) {
                secretTaps++;
            } else {
                secretTaps = 1; 
            }
            lastSecretTap = now;

            if (secretTaps >= 5) {
                secretOverlay.classList.add('unlocked');
            }
        });
    });

        // --- DATA PERSISTENCE (FOREVER SAFE) ---
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().then(granted => {
                console.log("Persistence Granted:", granted);
            });
        }

        let db;
        const request = indexedDB.open("VIVOstoreDB", 2);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains('threads')) db.createObjectStore('threads', { keyPath: 'id', autoIncrement: true });
            if (!db.objectStoreNames.contains('messages')) {
                const ms = db.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
                ms.createIndex('threadId', 'threadId', { unique: false });
            }
        };
        request.onsuccess = function(e) { db = e.target.result; loadThreads(); };

        let currentThreadId = null, threadToDeleteId = null, replyToId = null, longPressTimer, isSelectionMode = false;
        let selectedIds = new Set(), mediaRecorder, audioChunks = [];

        function attemptLogin() {
            if(document.getElementById('username-input').value.trim() === '77755') {
                document.getElementById('login-screen').remove();
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('add-btn').classList.remove('hidden');
            }
        }

        function showNewThreadModal() { document.getElementById('modal').classList.remove('hidden'); document.getElementById('new-thread-name').focus(); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function createThread(skip) {
            let title = document.getElementById('new-thread-name').value.trim();
            if(skip || !title) { const now = new Date(); title = now.toLocaleDateString(); }
            const tx = db.transaction(['threads'], 'readwrite');
            tx.objectStore('threads').add({ title: title, created: new Date() }).onsuccess = (e) => {
                closeModal(); openChat(e.target.result, title); loadThreads();
            };
        }

        function loadThreads() {
            // NEW: Update storage display every time we load the list
            updateStorageUsage(); 
            
            const list = document.getElementById('thread-list'); list.innerHTML = '';
            db.transaction(['threads'], 'readonly').objectStore('threads').openCursor(null, 'prev').onsuccess = (e) => {
                const cursor = e.target.result;
                if(cursor) {
                    const thisId = cursor.key; const thisTitle = cursor.value.title;
                    const item = document.createElement('div'); item.className = 'thread-item';
                    item.innerHTML = `<div class="thread-clickable"><span class="thread-title">${thisTitle}</span></div><button class="thread-menu-btn">⋮</button>`;
                    item.querySelector('.thread-clickable').onclick = () => openChat(thisId, thisTitle);
                    item.querySelector('.thread-menu-btn').onclick = (ev) => { ev.stopPropagation(); promptDeleteThread(thisId); };
                    list.appendChild(item); cursor.continue();
                }
            };
        }

        function promptDeleteThread(id) { threadToDeleteId = id; document.getElementById('thread-options-modal').classList.remove('hidden'); }
        function closeThreadOptions() { threadToDeleteId = null; document.getElementById('thread-options-modal').classList.add('hidden'); }
        function confirmDeleteThread() {
            if (!threadToDeleteId) return;
            const tx = db.transaction(['threads', 'messages'], 'readwrite');
            tx.objectStore('threads').delete(threadToDeleteId);
            const msgStore = tx.objectStore('messages');
            msgStore.index('threadId').openCursor(IDBKeyRange.only(threadToDeleteId)).onsuccess = (e) => {
                const cursor = e.target.result; if(cursor) { cursor.delete(); cursor.continue(); }
            };
            tx.oncomplete = () => { closeThreadOptions(); loadThreads(); };
        }

        function openChat(id, title) {
            currentThreadId = id; exitSelectionMode();
            document.getElementById('dashboard').classList.add('hidden'); document.getElementById('add-btn').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden'); document.getElementById('current-chat-title').innerText = title;
            loadMessages();
        }
        function closeChat() {
            currentThreadId = null; exitSelectionMode();
            document.getElementById('chat-screen').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); document.getElementById('add-btn').classList.remove('hidden');
        }
        function loadMessages() {
            const area = document.getElementById('chat-area'); area.innerHTML = '';
            db.transaction(['messages'], 'readonly').objectStore('messages').index('threadId').openCursor(IDBKeyRange.only(currentThreadId)).onsuccess = (e) => {
                const cursor = e.target.result; if(cursor) { renderMessage(cursor.value); cursor.continue(); }
            };
        }

        function renderMessage(msg) {
            const area = document.getElementById('chat-area');
            const wrapper = document.createElement('div'); wrapper.className = 'message-wrapper'; wrapper.dataset.id = msg.id;

            let contentHTML = '';
            if (Array.isArray(msg.content) && msg.type === 'image') {
                const count = msg.content.length;
                let gridClass = count >= 4 ? 'grid-4' : (count === 3 ? 'grid-3' : (count === 2 ? 'grid-2' : 'grid-1'));
                let imgs = msg.content.map(blob => `<img src="${URL.createObjectURL(blob)}" onclick="viewImage(this.src)">`).join('');
                contentHTML = `<div class="image-grid ${gridClass}">${imgs}</div>`;
            }
            else if (msg.type === 'image') contentHTML = `<img src="${URL.createObjectURL(msg.content)}" class="single-img" onclick="viewImage(this.src)">`;
            else if (msg.type === 'video') contentHTML = `<div class="video-container"><video controls src="${URL.createObjectURL(msg.content)}"></video></div>`;
            else if (msg.type === 'audio') contentHTML = `<audio controls src="${URL.createObjectURL(msg.content)}"></audio>`;
            else contentHTML = `<span>${msg.content}</span>`;

            let replyHTML = msg.replyTo ? `<div style="font-size:0.8rem; color:#aaa; margin-bottom:4px; border-left:2px solid var(--accent); padding-left:5px;">Replying...</div>` : '';
            wrapper.innerHTML = `<div class="message">${replyHTML}${contentHTML}</div><div class="message-time">${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;

            addInteractionEvents(wrapper, msg.id, msg.content);
            area.appendChild(wrapper); area.scrollTop = area.scrollHeight;
        }

        function addInteractionEvents(el, id, content) {
            let startX, startY;
            el.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                longPressTimer = setTimeout(() => { if(!isSelectionMode) enterSelectionMode(id); }, 500);
            });
            el.addEventListener('touchend', () => clearTimeout(longPressTimer));
            el.addEventListener('touchmove', (e) => {
                clearTimeout(longPressTimer); if(isSelectionMode) return;
                let diffX = e.touches[0].clientX - startX;
                if(Math.abs(diffX) > 50 && Math.abs(e.touches[0].clientY - startY) < 30) {
                    if(diffX < 0) el.classList.add('swiping-left'); else if(diffX > 0) startReply(id, content);
                }
            });
            el.addEventListener('click', (e) => { if(isSelectionMode) { e.stopPropagation(); e.preventDefault(); toggleSelection(id); } });
        }

        function enterSelectionMode(initialId) { isSelectionMode = true; document.getElementById('selection-header').classList.add('active'); toggleSelection(initialId); }
        function exitSelectionMode() { isSelectionMode = false; selectedIds.clear(); document.querySelectorAll('.message-wrapper.selected').forEach(el => el.classList.remove('selected')); document.getElementById('selection-header').classList.remove('active'); }
        function toggleSelection(id) {
            const el = document.querySelector(`.message-wrapper[data-id="${id}"]`);
            if(selectedIds.has(id)) { selectedIds.delete(id); el.classList.remove('selected'); } else { selectedIds.add(id); el.classList.add('selected'); }
            document.getElementById('selected-count').innerText = `${selectedIds.size} Selected`;
            if(selectedIds.size === 0) exitSelectionMode();
        }

        function deleteSelected() {
            if(selectedIds.size === 0) return;
            const tx = db.transaction(['messages'], 'readwrite'); const store = tx.objectStore('messages');
            selectedIds.forEach(id => { store.delete(Number(id)); const el = document.querySelector(`.message-wrapper[data-id="${id}"]`); if(el) el.remove(); });
            exitSelectionMode();
        }

        function viewImage(src) { if(isSelectionMode) return; document.getElementById('lightbox').classList.remove('hidden'); document.getElementById('lightbox-img').src = src; }
        function closeLightbox() { document.getElementById('lightbox').classList.add('hidden'); }

        function triggerFile() { document.getElementById('file-input').click(); }
        function handleFile(input) {
            if(!input.files || input.files.length === 0) return;
            const files = Array.from(input.files);
            
            // Separate Images from Videos
            let images = [];
            files.forEach(file => {
                if(file.type.startsWith('image/')) images.push(file);
                else if(file.type.startsWith('video/')) {
                    // 200MB Limit per video to prevent crashes
                    if(file.size > 200 * 1024 * 1024) {
                        alert("Video too large! Max size is 200MB.");
                    } else {
                        saveMessage('video', file, replyToId);
                    }
                }
            });
            
            if(images.length > 0) {
                if(images.length > 1) saveMessage('image', images, replyToId);
                else saveMessage('image', images[0], replyToId);
            }
            input.value = '';
        }

        function startReply(id, content) { replyToId = id; document.getElementById('reply-preview').classList.remove('hidden'); document.getElementById('msg-input').focus(); document.getElementById('reply-text').innerText = "Replying..."; }
        function cancelReply() { replyToId = null; document.getElementById('reply-preview').classList.add('hidden'); }
        
        document.getElementById('msg-input').addEventListener('input', function() {
            const hasText = this.value.trim().length > 0;
            document.getElementById('mic-btn').style.display = hasText ? 'none' : 'flex';
            document.getElementById('send-btn').style.display = hasText ? 'flex' : 'none';
        });

        function sendText() {
            const input = document.getElementById('msg-input'); if(!input.value.trim()) return;
            saveMessage('text', input.value.trim(), replyToId);
            input.value = ''; input.focus(); cancelReply();
            document.getElementById('mic-btn').style.display = 'flex'; document.getElementById('send-btn').style.display = 'none';
        }

        function saveMessage(type, content, replyId) {
            const tx = db.transaction(['messages'], 'readwrite');
            tx.objectStore('messages').add({ threadId: currentThreadId, type: type, content: content, replyTo: replyId || null, timestamp: new Date() }).onsuccess = (e) => renderMessage({ id: e.target.result, threadId: currentThreadId, type: type, content: content, replyTo: replyId || null, timestamp: new Date() });
        }

        function toggleRecord() {
            const btn = document.getElementById('mic-btn');
            if(mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
            } else {
                navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); audioChunks = [];
                    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="red"><path d="M6 6h12v12H6z"/></svg>`;
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => { saveMessage('audio', new Blob(audioChunks, {type:'audio/webm'}), replyToId); stream.getTracks().forEach(t=>t.stop()); }
                });
            }
        }
        function toggleMenu() { const m = document.getElementById('menu-dropdown'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
        function exportPDF() { document.getElementById('menu-dropdown').style.display = 'none'; window.print(); }

        // --- NEW STORAGE CALCULATOR ---
        async function updateStorageUsage() {
            if (navigator.storage && navigator.storage.estimate) {
                const { usage } = await navigator.storage.estimate();
                const usedMB = (usage / (1024 * 1024)).toFixed(2);
                if(document.getElementById('storage-display')) {
                    document.getElementById('storage-display').innerText = `Storage: ${usedMB} MB Used`;
                }
            }
        }
        
        // Initial Check
        updateStorageUsage();

        // --- REGISTER OFFLINE WORKER ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.error('Service Worker Error:', err));
        }
    </script>
</body>
</html>
